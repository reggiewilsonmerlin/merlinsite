<script type="text/babel">
const { DCArtboard, DCSection } = window;

/* ── shared image path ── */
const PHOTO = 'uploads/photos-1777807599577.jpeg';
const LOGO  = 'uploads/logo-1777807456164.png';

/* ── Marquee helper ── */
function Marquee({ items, cls, itemCls, sep = '·' }) {
  const doubled = [...items, ...items];
  return (
    <div className={cls} aria-hidden="true">
      <div style={{display:'inline-flex',animation:'marqueeA 22s linear infinite'}}>
        {doubled.map((t, i) => (
          <span key={i} className={itemCls}>{t}<span style={{opacity:0.35,marginLeft:'1rem'}}>{sep}</span></span>
        ))}
      </div>
    </div>
  );
}

const SERVICES_A = [
  { title: 'Servicing & Maintenance', desc: 'Oil changes, MOT prep, carburettor tuning, brakes and general upkeep. The most cost-effective way to keep your classic at its best.' },
  { title: 'Full Restoration', desc: 'Bare-metal to concours finish. Award-winning results with full photographic documentation throughout every stage.' },
